<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">

        <!-- CHECKED PROPERTIES -->
        <input type="text" id="myInput" placeholder="Enter your name">
        <button id="myButton">submit</button>
        <!-- to connect the label with the checkbox just add the 'for' attribute with the checkbox id -->
         <!-- id value and for value should match -->
        <input type="checkbox" id="myCheckbox"/>
        <label for="myCheckbox">Check me</label>
        <!-- Radio Buttons -->
        <!-- Here when we add the name attribute same for all radio inputs  -->
        <!-- It will acts as a group -->
        <input type="radio" id="hyderabad" name="radiocard" />
        <label for="hyderabad">Hyderabad</label>
        <input type="radio" id="mumbai" name="radiocard" />
        <label for="mumbai">Mumbai</label>
        <input type="radio" id="bangalore" name="radiocard" />
        <label for="bangalore">Bangalore</label>
        <!-- CHECKED PROPERTIES -->

    </div>
    <script src="index.js"></script>
</body>
</html>
